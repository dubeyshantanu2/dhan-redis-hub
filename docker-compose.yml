version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: dhan-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  dhan-redis-hub:
    build: .
    container_name: dhan-redis-hub
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
